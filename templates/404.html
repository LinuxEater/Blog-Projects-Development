{% extends 'base.html' %}
{% load static %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1 class="display-1 fw-bold text-info">404</h1>
            <h2 class="fw-bold">Page Not Found</h2>
            <p class="lead text-muted mb-4">
                Sorry, the page you are looking for does not exist, has been removed, or is temporarily unavailable.
            </p>
            <a href="{% url 'home' %}" class="btn btn-info btn-lg text-white">Back to Homepage</a>
        </div>
    </div>
</div>
{% endblock %}

<!-- Header Part-->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Dev.Souza</title>
    <link rel="icon" type="image/x-icon" href="https://img.icons8.com/external-outline-juicy-fish/60/external-developer-devops-outline-outline-juicy-fish.png">
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://kit.fontawesome.com/yourcode.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css?family=Playfair+Display:700,900" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
  </head>
<body>
    <div class="container">
      <header class="blog-header py-3">
        <div class="container">
  <header class="blog-header py-3">
    <div class="row flex-nowrap justify-content-between align-items-center">
      
      <!-- logo -->
      <div class="col-4 pt-1">
        <a class="fw-bold blog-header-logo text-dark" href="{% url 'home' %}" style="text-decoration:none;">[Dev.Souza]</a>
      </div>

          <div class="col-4">
            <form action="{% url 'search' %}" method="GET">
              <div class="input-group">
                        <input id="input" class="form-control" value="" type="text" name="keyword" placeholder="Enter search term..." aria-label="Enter search term..." aria-describedby="button-search" />
                        &nbsp;
                        <button type="submit" class="btn btn-info" id="button-search" type="button"><img width="20" height="20" src="https://img.icons8.com/ios/50/search--v1.png" alt="search--v1"/></button>
              </div>
            </form>
          </div>


      <!-- LOGIN/REGISTER -->
      <div class="col-4 d-flex justify-content-end align-items-center">
        {% if not user.is_authenticated %}
          <a class="btn btn-info" href="{% url 'login' %}">Login</a> &nbsp;
          <a class="btn btn-outline-secondary" href="{% url 'register' %}">Register</a>
        {% else %}
              <a class="btn btn-info" href="{% url 'dashboard' %}">Dashboard</a>
              &nbsp;
              <a class="btn btn-outline-danger" href="{% url 'logout' %}">Logout</a>
        {% endif %}
      </div>

    </div>
  </header>

  <div class="nav-scroller py-1 mb-2">
    <nav class="nav d-flex justify-content-between">
      {% for cat in categories %}
      <a id="navbar" class="p-2 text-muted" href="{% url 'posts_by_category' cat.id %}">{{ cat.category_name }}</a>
      {% endfor %}
    </nav>
  </div>
</div>





<!-- Main Content Part -->

{% block content %}

{% endblock %}


<!-- Footer part -->
<footer id="blog-footer" class="blog-footer">
  <p>Django blog built with <span style="color: #e25555;">&hearts;</span> by <a href="https://github.com/LinuxEater" target="_blank">Moises</a></p>
</footer>
<script src="{% static 'js/script.js' %}"></script>
<script src="https://kit.fontawesome.com/yourcode.js" crossorigin="anonymous"></script>
</body>
</html>
